spring.application.name=gac-api

spring.datasource.url=jdbc:h2:mem:gac;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true

gac.jwt.secret=dev-only-change-me-gac-jwt-secret-key-min-32-chars
gac.jwt.expiration-ms=86400000

gac.scheduler.expire-reservations-ms=3600000
